<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="../dashboard/dashboard.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
  <div class="structure">
    <header class="header">
      <nav class="search-bar">
        <div class="search">
          <input type="search" id="search-input" placeholder="Pesquisar..." />

          <dialog id="search-dialog">
            <div class="dialog-content">
              <h2>Resultados da pesquisa</h2>

              <table id="search-results">
                <thead>
                  <tr>
                    <th>Nome do cliente</th>
                    <th>Email do cliente</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>

              <button id="close-dialog" type="button">Fechar</button>
            </div>
          </dialog>
        </div>
      </nav>

      <div class="nav-right">
        <a href="#" class="user-icon">
          <i class="fas fa-user"></i>
        </a>

        <a href="#" class="user-name">nome</a>

        <span>|</span>

        <a href="../login/login.html" class="logout">Sair</a>
      </div>

      </nav>
    </header>
    <section class="sidebar">
      <div class="logo">
        <h1>OC</h1>
        <p class="logo-text">Operação Curiosidade</p>
      </div>
      <ul class="sidebar-menu">
        <li class="home">
          <a href="../dashboard/dashboard.html">
            <i class="fas fa-home"></i>
            <span class="menu-text">Home</span>
          </a>
        </li>
        <li>
          <a href="../customers/customers.html">
            <i class="fas fa-user-plus"></i>
            <span class="menu-text">Cadastro</span>
          </a>
        </li>
        <li>
          <a href="../record/record.html">
            <i class="fas fa-chart-line"></i>
            <span class="menu-text">Relatórios</span>
          </a>
        </li>
      </ul>
    </section>

    <main class="main-content">
      <div class="registration">
        <div class="card-registration" id="total-registrations" style="grid-area: total-registrations;">
          <h2>Total de Cadastros</h2>
          <p>0</p>
        </div>

        <div class="card-registration" id="registrations-month" style="grid-area: registrations-month;">
          <h2>Cadastros do Mês</h2>
          <p>0</p>
        </div>

        <div class="card-registration" id="registrations-pending" style="grid-area: registrations-pending;">
          <h2>Cadastros Pendentes</h2>
          <p>0</p>
        </div>

        <div class="card-registration" id="last-registrations" style="grid-area: last-registrations;">
          <h4>Últimos Cadastros</h1>
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Email</th>
                  <th class="align-right">Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>João Silva</td>
                  <td>joao.silva@example.com</td>
                  <td class="align-right status-pending">Pendente</td>
                </tr>
              </tbody>
            </table>
        </div>
    </main>

  </div>

  <script src="../dashboard/dashboard.js"></script>
  <script src="../global/search.js"></script>

</body>

</html>
