<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../record/record.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
  <div class="structure">
    <header class="header">
        <nav class="search-bar">
          <div class="search">
            <input type="search" id="search-input" placeholder="Pesquisar..." />

            <dialog id="search-dialog">
              <div class="dialog-content">
                <h2>Resultados da pesquisa</h2>

                <table id="search-results">
                  <thead>
                    <tr>
                      <th>Nome do cliente</th>
                      <th>Email do cliente</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>

                <button id="close-dialog" type="button">Fechar</button>
              </div>
            </dialog>
          </div>
        </nav>
      </header>
      <section class="sidebar">
        <div class="logo">
          <h1>OC</h1>
          <p class="logo-text">Operação Curiosidade</p>
        </div>

        <ul class="sidebar-menu">
          <li class="home">
            <a href="../dashboard/dashboard.html">
              <i class="fas fa-home"></i>
              <span class="menu-text">Home</span>
            </a>
          </li>
          <li>
            <a href="../customers/customers.html">
              <i class="fas fa-user-plus"></i>
              <span class="menu-text">Cadastro</span>
            </a>
          </li>
          <li>
            <a href="../record/record.html">
              <i class="fas fa-chart-line"></i>
              <span class="menu-text">Relatórios</span>
            </a>
          </li>
        </ul>
      </section>

      <main class="reports-main">
        <h1>Relatórios</h1>

        <div class="reports-table-wrap">
          <table class="reports-table">
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col" class="report-total">Pessoas</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><a href="../record/list/list.html?report=all">Lista de clientes</a></td>
                <td class="report-total" id="count-all">0</td>
              </tr>
              <tr>
                <td><a href="../record/list/list.html?report=active">Lista de clientes ativos</a></td>
                <td class="report-total" id="count-active">0</td>
              </tr>
              <tr>
                <td><a href="../record/list/list.html?report=inactive">Lista de clientes inativos</a></td>
                <td class="report-total" id="count-inactive">0</td>
              </tr>
              <tr>
                <td><a href="../record/list/list.html?report=this-month">Lista de cadastros do mês</a></td>
                <td class="report-total" id="count-this-month">0</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p id="report-note" role="status" hidden></p>
      </main>
  </div>

  <script src="../record/record.js" defer></script>
  <script src="../global/search.js"></script>
</body>

</html>
